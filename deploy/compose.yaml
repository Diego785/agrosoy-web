# One copy per environment on the server, e.g. /home/apps/www/solution/agrosoy/staging, each with
# its own .env (see .env.example next to this file and docs/deployment.md).
# No published ports: the server's shared nginx reaches the app by container name
# (agrosoy-<environment>) over the shared Docker network.
name: agrosoy-${ENVIRONMENT:?set ENVIRONMENT in .env}

services:
  app:
    image: ghcr.io/soluti0n-tech/agrosoy-web:${IMAGE_TAG:-main}
    container_name: agrosoy-${ENVIRONMENT}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://agrosoy:${POSTGRES_PASSWORD:?}@db:5432/agrosoy
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - proxy
    deploy:
      resources:
        limits:
          memory: 1g
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    container_name: agrosoy-${ENVIRONMENT}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: agrosoy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: agrosoy
      TZ: America/La_Paz
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrosoy -d agrosoy"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Only on the internal network: neither nginx nor the internet can reach the database.
    networks:
      - internal
    logging: *logging

volumes:
  db-data:

networks:
  internal:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-server-network}
