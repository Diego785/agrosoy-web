# Phase B, HTTPS: replaces the HTTP-only file once the certificate exists
# (deploy/README.md, step B4). Certificates are mounted at /etc/nginx/ssl in the shared nginx.
server {
    listen 80;
    listen [::]:80;

    server_name agrosoy.solution-services-tech.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name agrosoy.solution-services-tech.com;
    server_tokens off;

    ssl_certificate /etc/nginx/ssl/live/agrosoy.solution-services-tech.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/agrosoy.solution-services-tech.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Docker's DNS, resolved per request: nginx keeps working even when this app is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $agrosoy_staging http://agrosoy-staging:3000;

    # Spreadsheet imports.
    client_max_body_size 20M;

    location / {
        proxy_pass $agrosoy_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
