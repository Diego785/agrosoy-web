# Phase B, HTTP only: serves the certbot challenge and proxies the app. Goes in the shared nginx's
# conf/ folder as agrosoy-staging.conf until the certificate exists (deploy/README.md, step B1).
server {
    listen 80;
    listen [::]:80;

    server_name agrosoy.solution-services-tech.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Docker's DNS, resolved per request: nginx keeps working even when this app is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $agrosoy_staging http://agrosoy-staging:3000;

    client_max_body_size 20M;

    location / {
        proxy_pass $agrosoy_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
