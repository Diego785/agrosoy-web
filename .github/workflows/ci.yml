name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agrosoy
          POSTGRES_PASSWORD: agrosoy
          POSTGRES_DB: agrosoy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agrosoy -d agrosoy_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://agrosoy:agrosoy@localhost:5432/agrosoy_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  image:
    # Publishes the image that the VPS pulls; tagged with the commit SHA (to pin or roll back) and "main".
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/soluti0n-tech/agrosoy-web:main
            ghcr.io/soluti0n-tech/agrosoy-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
